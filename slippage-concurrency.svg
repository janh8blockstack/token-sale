<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: four concurrent requests queue through Sale.Buy's mutex one at a time; each successive turn buys against a higher totalTokensSold and pays a higher price; the fourth turn's price exceeds its minTokensOut tolerance and is rejected with ErrSlippageExceeded before any balance changes.">
  <defs>
    <marker id="scArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10201d"></path>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="620" fill="#ffffff" stroke="#c9d6d1" stroke-width="1"></rect>

  <text x="490" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#10201d" font-family="ui-monospace, Menlo, Consolas, monospace">Concurrent buys, one price ladder</text>
  <text x="490" y="54" text-anchor="middle" font-size="11" fill="#55665f" font-family="ui-sans-serif, Arial, sans-serif">The mutex below keeps four goroutines from corrupting each other's data.</text>
  <text x="490" y="68" text-anchor="middle" font-size="11" fill="#55665f" font-family="ui-sans-serif, Arial, sans-serif">It doesn't make them pay the same price — that's a separate guard.</text>

  <!-- Row A: concurrent arrival + mutex queue -->
  <line x1="55" y1="82" x2="610" y2="82" stroke="#55665f" stroke-width="1" stroke-dasharray="3 3"></line>
  <text x="332" y="79" text-anchor="middle" font-size="9.5" fill="#55665f" font-family="ui-sans-serif, Arial, sans-serif">arrive concurrently</text>

  <rect x="60" y="90" width="110" height="34" rx="3" fill="#ffffff" stroke="#10201d" stroke-width="1.1"></rect>
  <text x="115" y="111" text-anchor="middle" font-size="10.5" fill="#10201d" font-family="ui-monospace, Menlo, Consolas, monospace">req A</text>
  <rect x="205" y="90" width="110" height="34" rx="3" fill="#ffffff" stroke="#10201d" stroke-width="1.1"></rect>
  <text x="260" y="111" text-anchor="middle" font-size="10.5" fill="#10201d" font-family="ui-monospace, Menlo, Consolas, monospace">req B</text>
  <rect x="350" y="90" width="110" height="34" rx="3" fill="#ffffff" stroke="#10201d" stroke-width="1.1"></rect>
  <text x="405" y="111" text-anchor="middle" font-size="10.5" fill="#10201d" font-family="ui-monospace, Menlo, Consolas, monospace">req C</text>
  <rect x="495" y="90" width="110" height="34" rx="3" fill="#ffffff" stroke="#10201d" stroke-width="1.1"></rect>
  <text x="550" y="111" text-anchor="middle" font-size="10.5" fill="#10201d" font-family="ui-monospace, Menlo, Consolas, monospace">req D</text>

  <line x1="115" y1="124" x2="360" y2="158" stroke="#10201d" stroke-width="1" marker-end="url(#scArr)"></line>
  <line x1="260" y1="124" x2="400" y2="158" stroke="#10201d" stroke-width="1" marker-end="url(#scArr)"></line>
  <line x1="405" y1="124" x2="460" y2="158" stroke="#10201d" stroke-width="1" marker-end="url(#scArr)"></line>
  <line x1="550" y1="124" x2="500" y2="158" stroke="#10201d" stroke-width="1" marker-end="url(#scArr)"></line>

  <rect x="350" y="160" width="280" height="46" rx="4" fill="#fdf3e7" stroke="#b3660b" stroke-width="1.6"></rect>
  <text x="490" y="180" text-anchor="middle" font-size="11" fill="#b3660b" font-family="ui-monospace, Menlo, Consolas, monospace">Sale.Buy — mutex-protected</text>
  <text x="490" y="196" text-anchor="middle" font-size="9.5" fill="#55665f" font-family="ui-sans-serif, Arial, sans-serif">one goroutine inside at a time</text>

  <line x1="490" y1="206" x2="490" y2="228" stroke="#10201d" stroke-width="1.1" marker-end="url(#scArr)"></line>
  <text x="490" y="244" text-anchor="middle" font-size="10.5" fill="#10201d" font-family="ui-sans-serif, Arial, sans-serif">released one at a time, in whatever order the mutex grants the lock</text>

  <!-- Row B: price ladder -->
  <text x="70" y="292" font-size="10.5" fill="#10201d" font-family="ui-sans-serif, Arial, sans-serif" transform="rotate(-90 70 292)">higher price →</text>
  <line x1="90" y1="365" x2="880" y2="365" stroke="#b23b3b" stroke-width="1.2" stroke-dasharray="5 3"></line>
  <text x="100" y="358" font-size="9.5" fill="#b23b3b" font-family="ui-sans-serif, Arial, sans-serif">req C's minTokensOut tolerance</text>

  <!-- Turn 1 -->
  <rect x="110" y="450" width="150" height="70" fill="#007a94" opacity="0.85"></rect>
  <text x="185" y="440" text-anchor="middle" font-size="10.5" fill="#007a94" font-family="ui-sans-serif, Arial, sans-serif">✓ succeeds</text>
  <text x="185" y="538" text-anchor="middle" font-size="10" fill="#10201d" font-family="ui-monospace, Menlo, Consolas, monospace">Turn 1 — req B</text>

  <!-- Turn 2 -->
  <rect x="310" y="425" width="150" height="95" fill="#007a94" opacity="0.85"></rect>
  <text x="385" y="415" text-anchor="middle" font-size="10.5" fill="#007a94" font-family="ui-sans-serif, Arial, sans-serif">✓ succeeds</text>
  <text x="385" y="538" text-anchor="middle" font-size="10" fill="#10201d" font-family="ui-monospace, Menlo, Consolas, monospace">Turn 2 — req A</text>

  <!-- Turn 3 -->
  <rect x="510" y="395" width="150" height="125" fill="#007a94" opacity="0.85"></rect>
  <text x="585" y="385" text-anchor="middle" font-size="10.5" fill="#007a94" font-family="ui-sans-serif, Arial, sans-serif">✓ succeeds</text>
  <text x="585" y="538" text-anchor="middle" font-size="10" fill="#10201d" font-family="ui-monospace, Menlo, Consolas, monospace">Turn 3 — req D</text>

  <!-- Turn 4: rejected -->
  <rect x="710" y="350" width="150" height="170" fill="none" stroke="#b23b3b" stroke-width="2.2" stroke-dasharray="6 4"></rect>
  <text x="785" y="340" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b23b3b" font-family="ui-sans-serif, Arial, sans-serif">✗ ErrSlippageExceeded</text>
  <text x="785" y="538" text-anchor="middle" font-size="10" fill="#10201d" font-family="ui-monospace, Menlo, Consolas, monospace">Turn 4 — req C</text>

  <line x1="785" y1="520" x2="785" y2="520" stroke="none"></line>
  <line x1="90" y1="520" x2="880" y2="520" stroke="#10201d" stroke-width="1"></line>

  <!-- callout -->
  <line x1="785" y1="350" x2="785" y2="558" stroke="#b23b3b" stroke-width="0.8" stroke-dasharray="2 2"></line>
  <text x="785" y="572" text-anchor="middle" font-size="9.5" fill="#55665f" font-family="ui-sans-serif, Arial, sans-serif">rejected before any balance changes —</text>
  <text x="785" y="585" text-anchor="middle" font-size="9.5" fill="#55665f" font-family="ui-sans-serif, Arial, sans-serif">same validate-before-mutate rule as ErrInsufficientFunds</text>

  <!-- legend -->
  <rect x="90" y="600" width="10" height="10" fill="#007a94" opacity="0.85"></rect>
  <text x="106" y="609" font-size="9.5" fill="#55665f" font-family="ui-sans-serif, Arial, sans-serif">within minTokensOut — buy proceeds</text>
  <rect x="380" y="600" width="10" height="10" fill="none" stroke="#b23b3b" stroke-width="1.6" stroke-dasharray="3 2"></rect>
  <text x="396" y="609" font-size="9.5" fill="#55665f" font-family="ui-sans-serif, Arial, sans-serif">past minTokensOut — buy rejected, nothing mutated</text>
</svg>
